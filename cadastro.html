<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seja Voluntário - ONG Mãos que Transformam</title>

    <link rel="stylesheet" href="stylle.css">
</head>

<body>

    <header>

        <h1>Seja Voluntário</h1>

        <nav>
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="cadastro.html">Seja Voluntário</a>
        </nav>

    </header>

    <main>

        <section>

            <h2>Cadastro de Voluntário</h2>

            <p>
                Preencha o formulário abaixo para demonstrar seu interesse
                em participar das ações da ONG Mãos que Transformam.
            </p>

            <form>

                <label for="nome">Nome completo:</label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome completo"
                    required
                >


                <label for="cpf">CPF:</label>

                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    placeholder="Digite apenas os números"
                    inputmode="numeric"
                    maxlength="11"
                    required
                >


                <label for="telefone">Telefone:</label>

                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="Digite apenas os números"
                    inputmode="numeric"
                    maxlength="11"
                    required
                >


                <label for="email">E-mail:</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="seuemail@email.com"
                    required
                >


                <label for="cep">CEP:</label>

                <input
                    type="text"
                    id="cep"
                    name="cep"
                    placeholder="Digite apenas os números"
                    inputmode="numeric"
                    maxlength="8"
                    required
                >


                <label for="area">Área de interesse:</label>

                <select id="area" name="area" required>

                    <option value="">Selecione uma opção</option>

                    <option value="educacao">
                        Educação
                    </option>

                    <option value="alimentacao">
                        Distribuição de alimentos
                    </option>

                    <option value="eventos">
                        Eventos e campanhas
                    </option>

                    <option value="comunicacao">
                        Comunicação
                    </option>

                </select>


                <label for="mensagem">
                    Por que deseja ser voluntário?
                </label>

                <textarea
                    id="mensagem"
                    name="mensagem"
                    placeholder="Conte um pouco sobre seu interesse..."
                    required
                ></textarea>


                <button type="submit">
                    Enviar cadastro
                </button>

            </form>

        </section>

    </main>

    <footer>

        <p>
            &copy; 2026 ONG Mãos que Transformam
        </p>

    </footer>
<script src="script.js"></script>
</body>

</html>
