
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seja Voluntário - ONG Mãos que Transformam</title>

    <link rel="stylesheet" href="stylle.css">
</head>

<body>

    <header>
        <h1>Seja Voluntário</h1>

        <nav aria-label="Navegação principal">
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="cadastro.html" aria-current="page">Seja Voluntário</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Cadastro de Voluntário</h2>

            <p>
                Preencha o formulário abaixo para demonstrar seu interesse
                em participar das ações da ONG Mãos que Transformam.
            </p>

            <form id="formulario-voluntario">

                <!-- DADOS PESSOAIS -->
                <fieldset>
                    <legend>Dados pessoais</legend>

                    <label for="nome">Nome completo:</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome completo"
                        autocomplete="name"
                        required
                    >

                    <label for="cpf">CPF:</label>
                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="000.000.000-00"
                        inputmode="numeric"
                        autocomplete="off"
                        maxlength="14"
                        pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                        title="Digite o CPF no formato 000.000.000-00"
                        aria-describedby="erro-cpf"
                        required
                    >
                    <span id="erro-cpf" aria-live="polite"></span>

                    <label for="nascimento">Data de nascimento:</label>
                    <input
                        type="date"
                        id="nascimento"
                        name="nascimento"
                        autocomplete="bday"
                        required
                    >
                </fieldset>

                <!-- DADOS DE CONTATO -->
                <fieldset>
                    <legend>Dados de contato</legend>

                    <label for="telefone">Telefone:</label>
                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(11) 99999-9999"
                        inputmode="numeric"
                        autocomplete="tel"
                        maxlength="15"
                        pattern="\([0-9]{2}\) [0-9]{4,5}-[0-9]{4}"
                        title="Digite um telefone no formato (11) 99999-9999"
                        required
                    >

                    <label for="email">E-mail:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seuemail@email.com"
                        autocomplete="email"
                        required
                    >
                </fieldset>

                <!-- ENDEREÇO -->
                <fieldset>
                    <legend>Endereço</legend>

                    <label for="cep">CEP:</label>
                    <input
                        type="text"
                        id="cep"
                        name="cep"
                        placeholder="00000-000"
                        inputmode="numeric"
                        autocomplete="postal-code"
                        maxlength="9"
                        pattern="[0-9]{5}-[0-9]{3}"
                        title="Digite o CEP no formato 00000-000"
                        required
                    >

                    <label for="endereco">Endereço:</label>
                    <input
                        type="text"
                        id="endereco"
                        name="endereco"
                        placeholder="Digite seu endereço"
                        autocomplete="street-address"
                        required
                    >

                    <label for="cidade">Cidade:</label>
                    <input
                        type="text"
                        id="cidade"
                        name="cidade"
                        placeholder="Digite sua cidade"
                        autocomplete="address-level2"
                        required
                    >

                    <label for="estado">Estado:</label>
                    <select
                        id="estado"
                        name="estado"
                        autocomplete="address-level1"
                        required
                    >
                        <option value="">Selecione seu estado</option>
                        <option value="AC">Acre</option>
                        <option value="AL">Alagoas</option>
                        <option value="AP">Amapá</option>
                        <option value="AM">Amazonas</option>
                        <option value="BA">Bahia</option>
                        <option value="CE">Ceará</option>
                        <option value="DF">Distrito Federal</option>
                        <option value="ES">Espírito Santo</option>
                        <option value="GO">Goiás</option>
                        <option value="MA">Maranhão</option>
                        <option value="MT">Mato Grosso</option>
                        <option value="MS">Mato Grosso do Sul</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="PA">Pará</option>
                        <option value="PB">Paraíba</option>
                        <option value="PR">Paraná</option>
                        <option value="PE">Pernambuco</option>
                        <option value="PI">Piauí</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="RN">Rio Grande do Norte</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="RO">Rondônia</option>
                        <option value="RR">Roraima</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="SP">São Paulo</option>
                        <option value="SE">Sergipe</option>
                        <option value="TO">Tocantins</option>
                    </select>
                </fieldset>

                <!-- INTERESSE EM VOLUNTARIADO -->
                <fieldset>
                    <legend>Interesse em voluntariado</legend>

                    <label for="area">Área de interesse:</label>
                    <select id="area" name="area" required>
                        <option value="">Selecione uma opção</option>
                        <option value="educacao">Educação</option>
                        <option value="alimentacao">Distribuição de alimentos</option>
                        <option value="eventos">Eventos e campanhas</option>
                        <option value="comunicacao">Comunicação</option>
                    </select>

                    <label for="mensagem">
                        Por que deseja ser voluntário?
                    </label>
                    <textarea
                        id="mensagem"
                        name="mensagem"
                        placeholder="Conte um pouco sobre seu interesse..."
                        rows="5"
                        required
                    ></textarea>
                </fieldset>

                <button type="submit">Enviar cadastro</button>

                <p id="mensagem-formulario" aria-live="polite"></p>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 ONG Mãos que Transformam</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
